<linearGradient id="scan" x1="0" x2="1"><stop offset="0" stop-color="#FF1744" stop-opacity="0"/><stop offset=".5" stop-color="#FF1744" stop-opacity=".35"/><stop offset="1" stop-color="#FF1744" stop-opacity="0"/></linearGradient>
</defs>
<rect width="1200" height="320" fill="#0A0A0A"/>
