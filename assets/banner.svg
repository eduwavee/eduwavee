<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img"><style>
.grid{animation:mv 8s linear infinite}@keyframes mv{to{transform:translate(40px,40px)}}
.scan{animation:sc 5s linear infinite}@keyframes sc{from{transform:translateX(-300px)}to{transform:translateX(1300px)}}
.p{animation:fl 6s ease-in infinite;opacity:0}.p2{animation-delay:1.2s}.p3{animation-delay:2.4s}.p4{animation-delay:3.6s}.p5{animation-delay:4.8s}
@keyframes fl{0%{opacity:0;transform:translateY(0)}20%{opacity:.9}100%{opacity:0;transform:translateY(-230px)}}
.gr{animation:g1 4s infinite}
@keyframes g1{0%,88%,100%{transform:translate(0,0);opacity:0}90%{transform:translate(-5px,2px);opacity:1}93%{transform:translate(5px,-2px);opacity:1}96%{transform:translate(-3px,0);opacity:1}}
.dot{animation:bl 1.2s infinite}@keyframes bl{50%{opacity:.15}}
.cur{animation:bl 1s steps(1) infinite}
</style>
<defs>
